[build]
  publish = "public"
  functions = "netlify/functions"

# Daily refresh of legislative data. Runs at 09:00 UTC (5am ET) every day.
# Cron uses UTC per Netlify's scheduled functions docs.
[functions."refresh-data"]
  schedule = "0 9 * * *"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

# Manually-triggerable refresh (protected by REFRESH_SECRET env var).
# Scheduled functions can't be invoked via URL, so this is a separate
# HTTP function that shares the same fetch/store logic — useful for
# testing or forcing an update without waiting for the daily cron.
# Ignores the cooldown that /api/refresh-now respects, so use sparingly.
[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/trigger-refresh"
  status = 200

# Public, cooldown-protected refresh — safe to expose as a button in the UI.
# See public-refresh.mts for the cooldown logic.
[[redirects]]
  from = "/api/refresh-now"
  to = "/.netlify/functions/public-refresh"
  status = 200
